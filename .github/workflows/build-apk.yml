name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 配置 JDK 25 和 Gradle 缓存
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: 安装 Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-37.2' 'build-tools;37.0.0'

      - name: 恢复已有调试签名（可选）
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            android_user_home="${ANDROID_USER_HOME:-$HOME/.android}"
            umask 077
            mkdir -p "$android_user_home"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$android_user_home/debug.keystore"
          fi

      - name: 运行单元测试并构建 Debug APK
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: 验证 APK 签名
        run: '"$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: weight-journal-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 恢复原调试密钥
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::error::缺少仓库 Secret ANDROID_DEBUG_KEYSTORE_BASE64。'
            exit 1
          fi

          umask 077
          keystore="$RUNNER_TEMP/weight-journal-debug.keystore"
          if ! printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore" || [[ ! -s "$keystore" ]]; then
            echo '::error::无法从 ANDROID_DEBUG_KEYSTORE_BASE64 恢复调试密钥库。'
            exit 1
          fi

      - name: 配置 JDK 25 和 Gradle 缓存
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: 安装 Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-37.2' 'build-tools;37.0.0'

      - name: 运行单元测试并构建 Debug APK
        run: |
          bash ./gradlew --no-daemon --console=plain \
            "-PweightJournalDebugKeystore=$RUNNER_TEMP/weight-journal-debug.keystore" \
            :app:testDebugUnitTest :app:assembleDebug

      - name: 验证 APK 使用原签名证书
        env:
          ANDROID_DEBUG_CERT_SHA256: '9f917e3031c3b55d7573e2406fd20030838cf0ccb09d9d0394d0ee244dba28e9'
        run: |
          certs="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$certs"
          actual_sha256="$(sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' <<< "$certs")"
          if [[ "${actual_sha256,,}" != "$ANDROID_DEBUG_CERT_SHA256" ]]; then
            echo "::error::APK 签名与旧版不一致。预期证书 SHA-256 为 $ANDROID_DEBUG_CERT_SHA256。"
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: weight-journal-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
